name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr libleptonica-dev fonts-liberation fonts-dejavu-core fonts-freefont-ttf \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Python packages
        run: pip install -e ".[dev,gui]"
      # docx-to-idml: Reflow's converter (run from source) and its IDML checker, which
      # validates every export against Adobe's schema (jing, with the runner's Java).
      - name: docx-to-idml
        run: |
          git clone --depth 1 https://github.com/RexBHavgreau/docx-to-idml ../docx-to-idml
          pip install -r ../docx-to-idml/requirements-dev.txt
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
          ECTYPE_DOCX2IDML: python -m docx2idml
          ECTYPE_DOCX2IDML_SOURCE: ${{ github.workspace }}/../docx-to-idml
        run: |
          export PYTHONPATH="$ECTYPE_DOCX2IDML_SOURCE"
          pytest -q
