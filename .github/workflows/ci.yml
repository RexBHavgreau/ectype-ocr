name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr libleptonica-dev fonts-liberation fonts-dejavu-core fonts-freefont-ttf \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Python packages
        run: pip install -e ".[dev,gui]"
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q
