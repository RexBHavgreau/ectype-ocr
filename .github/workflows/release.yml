name: Windows installer

# Builds Ectype-OCR-<version>-Setup.exe. Pushing a tag like v0.1.0 builds it and
# attaches it to a GitHub release. A push that changes the packaging, or running
# the workflow by hand, builds a test installer (under the run's artifacts) and
# releases nothing.
on:
  push:
    tags: ["v*"]  # tag pushes ignore the path filter below: every v* tag builds
    branches: ["**"]
    paths: ["packaging/**", "assets/ectype-icon/**", ".github/workflows/release.yml", "src/ectype/resources.py", "src/ectype/kraken_worker.py",
            "src/ectype/train.py", "src/ectype/training.py", "src/ectype/synthtrain.py"]
  workflow_dispatch:
    inputs:
      engine_for_release:
        description: "Build only the Kraken engine and attach it to this existing release (e.g. v0.3.0)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  installer:
    if: github.event.inputs.engine_for_release == '' || github.event.inputs.engine_for_release == null
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Version from the tag
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-dev.${GITHUB_RUN_NUMBER}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          sed -i "s/^__version__ = .*/__version__ = \"$v\"/" src/ectype/__init__.py
          cat src/ectype/__init__.py

      - name: Tesseract and Inno Setup
        run: choco install tesseract innosetup -y --no-progress

      - name: Python packages
        run: |
          python -m pip install --upgrade pip
          pip install . "PySide6-Essentials>=6.6" "pyinstaller>=6.10"

      - name: Bundle Tesseract (program, libraries, licences, English and orientation data, output configs)
        shell: pwsh
        run: |
          $src = "C:\Program Files\Tesseract-OCR"
          $dst = "packaging\build\tesseract"
          robocopy $src $dst /E /XD tessdata /XF tesseract-uninstall.exe /NFL /NDL /NJH /NJS
          if ($LASTEXITCODE -ge 8) { exit 1 }
          New-Item -ItemType Directory -Force "$dst\tessdata" | Out-Null
          Copy-Item "$src\tessdata\eng.traineddata", "$src\tessdata\osd.traineddata" "$dst\tessdata"
          Copy-Item "$src\tessdata\configs", "$src\tessdata\tessconfigs" "$dst\tessdata" -Recurse  # hocr lives here
          & "$dst\tesseract.exe" --version
          # Tesseract's training tools must start with only their own folder and Windows' to draw
          # on, as the app runs them. In this package two of them can't: its ICU needs a C++
          # runtime entry point (0xC0000139) its own libstdc++ lacks, so a user's PC fails to add
          # characters (Hebrew's points). Those tools then come from MSYS2's Tesseract, built
          # against one runtime, into a "training" folder of their own with the libraries they use.
          $full = (Resolve-Path $dst).Path
          $sys = "$env:SystemRoot\System32"
          $saved = $env:PATH
          function Test-Tools($dir, $names) {
            $env:PATH = "$dir;$full;$sys;$env:SystemRoot"
            $bad = @()
            foreach ($t in $names) {
              if (-not (Test-Path "$dir\$t.exe")) { $bad += "$t (missing)"; continue }
              & "$dir\$t.exe" --version *> $null
              # 0xC0000135: a DLL not found; 0xC0000139: an entry point not found.
              if ($LASTEXITCODE -eq -1073741515 -or $LASTEXITCODE -eq -1073741511) { $bad += "$t ($LASTEXITCODE)" }
            }
            $env:PATH = $saved
            return $bad
          }
          $tools = "tesseract", "unicharset_extractor", "combine_lang_model", "merge_unicharsets", "lstmtraining", "combine_tessdata", "dawg2wordlist"
          $bad = Test-Tools $full $tools
          if (-not $bad) { Write-Host "Every tool starts with the package's own libraries."; exit 0 }
          Write-Host "Can't start with the package's own libraries: $($bad -join ', ')"
          $failing = @($bad | ForEach-Object { ($_ -split ' ')[0] })
          if ($failing -contains "tesseract" -or $failing -contains "lstmtraining") { Write-Host "::error::Tesseract itself can't start"; exit 1 }
          $env:MSYSTEM = "UCRT64"
          $env:CHERE_INVOKING = "1"
          $bash = "C:\msys64\usr\bin\bash.exe"
          & $bash -lc "pacman -S --noconfirm --needed mingw-w64-ucrt-x86_64-tesseract-ocr" | Select-Object -Last 3
          $training = "$full\training"
          New-Item -ItemType Directory -Force $training | Out-Null
          foreach ($t in $failing) {
            $exe = "C:\msys64\ucrt64\bin\$t.exe"
            if (-not (Test-Path $exe)) { Write-Host "::error::MSYS2's Tesseract has no $t.exe"; exit 1 }
            Copy-Item $exe $training -Force
            $dlls = & $bash -lc "ldd /ucrt64/bin/$t.exe" | ForEach-Object { if ($_ -match '=> (/ucrt64/bin/\S+\.dll)') { $Matches[1] } }
            foreach ($d in $dlls) { Copy-Item ("C:\msys64" + ($d -replace '/', '\')) $training -Force }
          }
          Write-Host "Training tools from MSYS2: $($failing -join ', '); with $((Get-ChildItem $training -Filter *.dll).Count) libraries"
          $bad = Test-Tools $training $failing
          if ($bad) { Write-Host "::error::MSYS2's training tools can't start either: $($bad -join ', ')"; exit 1 }
          Copy-Item "C:\msys64\ucrt64\share\licenses\tesseract-ocr" "$training\licenses" -Recurse -ErrorAction SilentlyContinue
          Write-Host "Every tool starts."
          exit 0

      - name: Bundle EB Garamond
        run: python packaging/fetch_fonts.py packaging/build/fonts

      - name: Build the program folder (PyInstaller)
        env:
          ECTYPE_TESSERACT_DIR: packaging/build/tesseract
          ECTYPE_FONTS_DIR: packaging/build/fonts
        run: pyinstaller packaging/ectype.spec --noconfirm --distpath dist --workpath build/pyi

      - name: Smoke test the packaged app (synthetic page, every mode, IDML)
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          $PSNativeCommandUseErrorActionPreference = $true  # a failing ectype.exe fails the step
          $ectype = "dist\Ectype OCR\ectype.exe"
          & $ectype --version
          & $ectype synth -o smoke\synth --clean
          & $ectype run smoke\synth\scan.pdf -o smoke\work --name smoke
          & $ectype run smoke\synth\scan.pdf -o smoke\work2 --mode substitute --name sub
          if (-not (Test-Path smoke\work\traced\smoke.pdf)) { throw "traced PDF missing" }
          if (-not (Test-Path smoke\work2\substitute\sub.pdf)) { throw "substitute PDF missing" }
          & $ectype run smoke\synth\scan.pdf -o smoke\work3 --mode text --page-image bw --name text
          if (-not (Test-Path smoke\work3\textlayer\text.pdf)) { throw "text-layer PDF missing" }
          & $ectype idml smoke\work3 -o smoke\facsimile.idml --mode facsimile
          if (-not (Test-Path smoke\facsimile\facsimile.idml)) { throw "IDML missing" }
          if (-not (Test-Path smoke\facsimile\Links\p001.jpg)) { throw "IDML links missing" }
          # Training: lines set in Windows' own fonts (Hebrew needs Pillow's raqm layout in the app),
          # then a short training of Greek from the pool, read with afterwards.
          $env:ECTYPE_DATA_DIR = "$PWD\smoke\data"
          New-Item -ItemType Directory -Force smoke\fonts | Out-Null
          Copy-Item C:\Windows\Fonts\times.ttf, C:\Windows\Fonts\arial.ttf, C:\Windows\Fonts\georgia.ttf smoke\fonts
          & $ectype train-synthetic --fonts smoke\fonts --script hebrew greek --lines 20
          & $ectype train --lang grc --iterations 40
          # Hebrew needs its vowel points added to the model, by the training tools that once
          # couldn't start on users' PCs.
          $heb = & $ectype train --lang heb --iterations 40 2>&1 | Out-String
          Write-Host $heb
          if ($heb -match "couldn't add those characters|Too few images") { Write-Host "::error::Training Hebrew couldn't add its points"; exit 1 }
          & $ectype models
          # Training the OCR model needs Tesseract's training tools inside the app.
          $tools = Get-ChildItem -Recurse "dist\Ectype OCR" -Include lstmtraining.exe, combine_tessdata.exe, unicharset_extractor.exe, merge_unicharsets.exe, combine_lang_model.exe, dawg2wordlist.exe | Select-Object -ExpandProperty Name
          Write-Host "Training tools in the app: $($tools -join ', ')"
          if (-not ($tools -contains "lstmtraining.exe")) { Write-Host "::warning::lstmtraining.exe is not in the app: Train OCR model won't work" }

      - name: Installer (Inno Setup)
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.version.outputs.version }}" packaging\installer.iss'

      - uses: actions/upload-artifact@v4
        with:
          name: Ectype-OCR-${{ steps.version.outputs.version }}-Setup
          path: packaging/Output/*.exe

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: packaging/Output/*.exe
          generate_release_notes: true

  # The Kraken engine: Kraken and PyTorch (CPU) as ectype-kraken.exe, zipped as an optional
  # download the app fetches from this release (Languages > Add languages > Kraken models).
  kraken-engine:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Version from the tag
        id: version
        shell: bash
        env:
          ENGINE_FOR: ${{ github.event.inputs.engine_for_release }}
        run: |
          if [[ -n "$ENGINE_FOR" ]]; then v="${ENGINE_FOR#v}"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-dev.${GITHUB_RUN_NUMBER}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Python packages (PyTorch for the CPU, then Kraken)
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install kraken "pyinstaller>=6.10"

      - name: Build the engine folder (PyInstaller)
        run: pyinstaller packaging/ectype-kraken.spec --noconfirm --distpath dist-kraken --workpath build/pyi-kraken

      - name: Smoke test (version, a model from the repository, reading and training a few lines)
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $engine = "dist-kraken\Ectype OCR Kraken\ectype-kraken.exe"
          & $engine version
          pip install pillow
          python packaging/kraken_smoke.py $engine smoke-kraken

      - name: Zip
        shell: pwsh
        run: |
          $name = "Ectype-OCR-Kraken-${{ steps.version.outputs.version }}-win64.zip"
          Compress-Archive -Path "dist-kraken\Ectype OCR Kraken" -DestinationPath $name
          Get-Item $name | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: Ectype-OCR-Kraken-${{ steps.version.outputs.version }}-win64
          path: Ectype-OCR-Kraken-*-win64.zip

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.engine_for_release != ''
        uses: softprops/action-gh-release@v2
        with:
          files: Ectype-OCR-Kraken-*-win64.zip
          tag_name: ${{ github.event.inputs.engine_for_release || github.ref_name }}
